name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Monta a pasta do site
        run: |
          mkdir -p site/dados
          cp index.html manifest.json icone.svg site/
          cp -r app site/app
          cp dados/meta.json site/dados/
          touch site/.nojekyll

      - name: Carimba a versão nos arquivos (evita cache antigo no celular)
        run: python3 .github/versionar.py site "${GITHUB_SHA::8}"
      - name: Envia para o branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          commit_message: "Publica o site a partir de ${{ github.sha }}"
