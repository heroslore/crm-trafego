<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta name="crm-versao" content="6e46ccb4">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>CRM de Tráfego</title>
<meta name="description" content="Central de comando de tráfego pago e CRM: campanhas, criativos, produtos, leads, vendas, financeiro e tarefas.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CRM Tráfego">
<link rel="icon" type="image/svg+xml" href="icone.svg">
<link rel="apple-touch-icon" href="icone.svg">
<link rel="stylesheet" href="app/styles.css?v=6e46ccb4">
<script>try{var t=localStorage.getItem("crm-trafego-tema");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body>
<div class="app">
  <aside class="lateral" id="lateral">
    <div class="marca"><i>📈</i><span>CRM de Tráfego</span></div>
    <div class="empresa-sel"><select id="empresaSel" title="Empresa / loja"></select></div>
    <nav class="menu" id="menu"></nav>
    <div class="rodape">
      <button class="usuario" id="btnUsuario"><span class="avatar" id="avatar">A</span><span><span class="nome" id="usuarioNome">—</span><br><span class="papel" id="usuarioPapel"></span></span></button>
    </div>
  </aside>
  <div class="fundo-lateral" id="fundoLateral"></div>
  <div class="conteudo">
    <header class="topo">
      <button class="hamb" id="btnMenu" aria-label="Menu">☰</button>
      <div class="busca"><input type="search" id="busca" placeholder="Buscar lead, produto, campanha, criativo…" autocomplete="off"><div class="busca-res" id="buscaRes"></div></div>
      <div class="esp"></div>
      <div class="periodo" id="periodo"></div>
      <button class="ico-btn" id="btnNotif" title="Notificações">🔔<span class="cont" id="notifCont" style="display:none"></span></button>
      <button class="ico-btn" id="btnTema" title="Tema claro/escuro">◐</button>
    </header>
    <div class="painel-notif" id="painelNotif"></div>
    <main class="pagina" id="pagina"></main>
  </div>
</div>
<div class="modal-fundo" id="modal-fundo"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script type="module" src="app/main.js?v=6e46ccb4"></script>
</body>
</html>
