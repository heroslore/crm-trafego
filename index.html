<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>CRM de Tráfego — Lojas</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16324a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CRM Tráfego">
<link rel="icon" type="image/svg+xml" href="icone.svg">
<link rel="apple-touch-icon" href="icone.svg">
<style>
  :root {
    --azul:#16324a; --azul-claro:#1f4666; --areia:#f7f3ec; --verde:#2e8b57; --verde-claro:#e5f3ec;
    --vermelho:#c0392b; --vermelho-claro:#fbe4e1; --amarelo:#b7791f; --amarelo-claro:#fdf3dc;
    --cinza:#8a94a0; --cinza-claro:#e9e5dc; --laranja:#f2762e; --laranja-suave:#fdeadd;
    --ciano:#1e7fc2; --ciano-suave:#ddeefa; --roxo:#7b4fb0; --roxo-suave:#eee6f8;
    --texto:#16324a; --card:#fff; --borda:#e0dbd0;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body { font-family:"Segoe UI",Roboto,Arial,sans-serif; background:var(--areia); color:var(--texto); min-height:100vh; padding-bottom:84px; }
  header { background:var(--azul); color:#fff; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px; position:sticky; top:0; z-index:40; }
  header h1 { font-size:1.1rem; line-height:1.2; }
  header .sub { font-size:0.76rem; opacity:0.85; margin-top:2px; }
  header .status { font-size:0.74rem; text-align:right; opacity:0.9; max-width:48%; }
  main { max-width:900px; margin:0 auto; padding:14px 14px 20px; }
  nav { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:2px solid var(--borda); display:flex; z-index:50; }
  nav button { flex:1; border:none; background:none; padding:9px 0 11px; font-size:0.68rem; color:var(--cinza); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; }
  nav button .ico { font-size:1.2rem; }
  nav button.ativa { color:var(--laranja); font-weight:700; }
  .tela { display:none; } .tela.ativa { display:block; }

  .filtros { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; align-items:center; }
  .filtros select, .filtros input[type=date] { padding:8px 10px; border:1.5px solid var(--borda); border-radius:10px; background:#fff; font-size:0.9rem; color:var(--texto); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { padding:6px 11px; border-radius:999px; border:1.5px solid var(--borda); background:#fff; font-size:0.8rem; cursor:pointer; color:var(--texto); white-space:nowrap; }
  .chip.ativa { background:var(--azul); color:#fff; border-color:var(--azul); }
  .chip.loja.ativa { background:var(--loja-cor, var(--laranja)); border-color:var(--loja-cor, var(--laranja)); }

  .cartao { background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(22,50,74,0.08); }
  .cartao h2 { font-size:1rem; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .cartao h2 small { font-weight:400; color:var(--cinza); font-size:0.78rem; }
  .cartao h3 { font-size:0.92rem; margin:12px 0 6px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:8px; }
  .kpi { background:var(--areia); border-radius:12px; padding:10px 12px; }
  .kpi .r { font-size:0.72rem; color:var(--cinza); text-transform:uppercase; letter-spacing:0.02em; }
  .kpi .v { font-size:1.25rem; font-weight:700; margin-top:2px; line-height:1.15; }
  .kpi .d { font-size:0.74rem; margin-top:3px; color:var(--cinza); }
  .kpi .d.up { color:var(--verde); } .kpi .d.down { color:var(--vermelho); }
  .kpi.destaque { background:var(--azul); color:#fff; } .kpi.destaque .r, .kpi.destaque .d { color:#cfe0ee; }
  .kpi.destaque .d.up { color:#9be2b6; } .kpi.destaque .d.down { color:#ffb3a7; }

  .aviso { padding:10px 12px; border-radius:10px; font-size:0.86rem; margin-bottom:8px; line-height:1.4; }
  .aviso.alerta { background:var(--amarelo-claro); color:#6d4a10; border-left:4px solid var(--amarelo); }
  .aviso.erro { background:var(--vermelho-claro); color:#7a2218; border-left:4px solid var(--vermelho); }
  .aviso.ok { background:var(--verde-claro); color:#1e5b3a; border-left:4px solid var(--verde); }
  .aviso.info { background:var(--ciano-suave); color:#0f4c73; border-left:4px solid var(--ciano); }
  .vazio { color:var(--cinza); font-size:0.88rem; padding:10px 0; text-align:center; }

  .grafico { width:100%; height:190px; display:block; }
  .legenda { display:flex; gap:14px; font-size:0.76rem; color:var(--cinza); margin-top:4px; flex-wrap:wrap; }
  .legenda i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:middle; }

  .barras { display:flex; flex-direction:column; gap:6px; }
  .barra { display:grid; grid-template-columns:minmax(86px, 34%) 1fr auto; gap:8px; align-items:center; font-size:0.82rem; }
  .barra .n { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .barra .t { background:var(--cinza-claro); border-radius:6px; height:14px; overflow:hidden; }
  .barra .t i { display:block; height:100%; background:var(--laranja); border-radius:6px; min-width:2px; }
  .barra .v { font-variant-numeric:tabular-nums; white-space:nowrap; color:var(--texto); text-align:right; }
  .barra .v small { color:var(--cinza); }

  .lista { display:flex; flex-direction:column; gap:8px; }
  .item { background:var(--areia); border-radius:12px; padding:10px 12px; }
  .item .topo { display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
  .item .nome { font-weight:700; font-size:0.95rem; line-height:1.25; }
  .item .meta { font-size:0.78rem; color:var(--cinza); margin-top:2px; }
  .item .nums { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:8px; font-size:0.82rem; }
  .item .nums b { font-variant-numeric:tabular-nums; }
  .item .nums span small { color:var(--cinza); }
  .item.expandido { background:#fff; border:1.5px solid var(--borda); }
  .detalhe { margin-top:10px; border-top:1px dashed var(--borda); padding-top:10px; }
  .anuncio { display:grid; grid-template-columns:56px 1fr; gap:10px; padding:8px 0; border-bottom:1px solid var(--cinza-claro); font-size:0.82rem; }
  .anuncio:last-child { border-bottom:none; }
  .anuncio img, .anuncio .semimg { width:56px; height:56px; object-fit:cover; border-radius:8px; background:var(--cinza-claro); display:block; }
  .anuncio .semimg { display:flex; align-items:center; justify-content:center; font-size:1.3rem; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:0.7rem; font-weight:700; white-space:nowrap; vertical-align:middle; }
  .badge.ativa { background:var(--verde-claro); color:var(--verde); }
  .badge.pausada { background:var(--cinza-claro); color:#5d6771; }
  .badge.loja { color:#fff; background:var(--loja-cor, var(--laranja)); }
  .badge.status-novo { background:var(--ciano-suave); color:#0f4c73; }
  .badge.status-atendimento { background:var(--amarelo-claro); color:#6d4a10; }
  .badge.status-orcamento { background:var(--roxo-suave); color:var(--roxo); }
  .badge.status-vendido { background:var(--verde-claro); color:var(--verde); }
  .badge.status-perdido { background:var(--vermelho-claro); color:var(--vermelho); }

  .btn { display:block; width:100%; padding:13px; border:none; border-radius:12px; font-size:1rem; font-weight:700; cursor:pointer; color:#fff; background:var(--azul); margin-top:8px; }
  .btn-verde { background:var(--verde); } .btn-laranja { background:var(--laranja); } .btn-cinza { background:var(--cinza); } .btn-vermelho { background:var(--vermelho); }
  .btn-pq { display:inline-block; width:auto; padding:7px 12px; font-size:0.82rem; margin:0; border-radius:9px; }
  .btn-vazado { background:none; border:1.5px solid var(--borda); color:var(--texto); }
  .btn:disabled { opacity:0.55; }
  .linha-btns { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }

  label.campo { display:block; font-size:0.82rem; color:var(--cinza); margin:10px 0 4px; }
  input[type=text], input[type=tel], input[type=number], input[type=password], select, textarea { width:100%; padding:11px 12px; border:1.5px solid var(--borda); border-radius:10px; font-size:1rem; background:#fff; color:var(--texto); font-family:inherit; }
  textarea { min-height:70px; resize:vertical; }
  .duas { display:grid; grid-template-columns:1fr 1fr; gap:8px; }

  .funil { display:grid; grid-template-columns:repeat(5, 1fr); gap:4px; margin-bottom:10px; }
  .funil button { border:none; border-radius:10px; padding:8px 4px; font-size:0.72rem; cursor:pointer; background:var(--areia); color:var(--texto); line-height:1.2; }
  .funil button b { display:block; font-size:1.1rem; }
  .funil button.ativa { outline:2px solid var(--azul); }
  .etapas { display:flex; gap:4px; flex-wrap:wrap; margin-top:8px; }
  .etapas button { border:1.5px solid var(--borda); background:#fff; border-radius:8px; padding:5px 8px; font-size:0.74rem; cursor:pointer; color:var(--texto); }
  .etapas button.ativa { background:var(--azul); color:#fff; border-color:var(--azul); }

  .modal-fundo { display:none; position:fixed; inset:0; background:rgba(22,50,74,0.55); z-index:100; align-items:flex-end; justify-content:center; }
  .modal-fundo.aberto { display:flex; }
  .modal { background:#fff; width:100%; max-width:560px; max-height:92vh; overflow:auto; border-radius:18px 18px 0 0; padding:16px 16px 24px; }
  .modal h2 { font-size:1.05rem; margin-bottom:6px; display:flex; justify-content:space-between; }
  .modal h2 button { border:none; background:none; font-size:1.3rem; cursor:pointer; color:var(--cinza); }
  .tabela { width:100%; border-collapse:collapse; font-size:0.8rem; }
  .tabela th, .tabela td { padding:6px 4px; text-align:right; border-bottom:1px solid var(--cinza-claro); white-space:nowrap; }
  .tabela th:first-child, .tabela td:first-child { text-align:left; white-space:normal; }
  .tabela th { color:var(--cinza); font-weight:600; font-size:0.72rem; }
  .mini { font-size:0.78rem; color:var(--cinza); line-height:1.4; }
  code { background:var(--cinza-claro); padding:1px 5px; border-radius:5px; font-size:0.85em; }
  .loja-card { border-left:6px solid var(--loja-cor, var(--laranja)); }
  .progresso { background:var(--cinza-claro); border-radius:6px; height:10px; overflow:hidden; margin-top:6px; }
  .progresso i { display:block; height:100%; background:var(--loja-cor, var(--laranja)); }
  .toast { position:fixed; left:50%; bottom:92px; transform:translateX(-50%); background:var(--azul); color:#fff; padding:10px 16px; border-radius:12px; font-size:0.88rem; z-index:200; display:none; max-width:90vw; text-align:center; }
  .toast.mostra { display:block; }
  .horas { display:grid; grid-template-columns:repeat(24, 1fr); gap:2px; align-items:end; height:90px; }
  .horas div { background:var(--ciano); border-radius:3px 3px 0 0; min-height:2px; position:relative; }
  .horas-rot { display:grid; grid-template-columns:repeat(24, 1fr); font-size:0.58rem; color:var(--cinza); text-align:center; margin-top:2px; }
  @media (min-width:640px){ .modal-fundo { align-items:center; } .modal { border-radius:18px; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>📈 CRM de Tráfego</h1>
    <div class="sub" id="cabSub">carregando dados…</div>
  </div>
  <div class="status" id="cabStatus"></div>
</header>

<main>
  <div class="filtros" id="filtros">
    <div class="chips" id="chipsPeriodo"></div>
    <div id="datasCustom" style="display:none; gap:6px;">
      <input type="date" id="dtInicio"> <input type="date" id="dtFim">
    </div>
    <div class="chips" id="chipsLojas"></div>
  </div>

  <section class="tela ativa" id="tela-painel"></section>
  <section class="tela" id="tela-lojas"></section>
  <section class="tela" id="tela-campanhas"></section>
  <section class="tela" id="tela-publico"></section>
  <section class="tela" id="tela-leads"></section>
  <section class="tela" id="tela-ajustes"></section>
</main>

<nav>
  <button data-tela="painel" class="ativa"><span class="ico">📊</span>Painel</button>
  <button data-tela="lojas"><span class="ico">🏬</span>Lojas</button>
  <button data-tela="campanhas"><span class="ico">📣</span>Campanhas</button>
  <button data-tela="publico"><span class="ico">👥</span>Público</button>
  <button data-tela="leads"><span class="ico">🤝</span>Leads</button>
  <button data-tela="ajustes"><span class="ico">⚙️</span>Ajustes</button>
</nav>

<div class="modal-fundo" id="modalFundo"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
// ============================================================ estado
var META = null;            // dados coletados da Meta (crm/dados/meta.json)
var CRM = null;             // dados do CRM (lojas, leads, atribuições) — locais + nuvem
var tela = "painel";
var periodo = { tipo: "30d", inicio: "", fim: "" };
var lojaFiltro = "todas";
var campanhasSo = "entrega"; // entrega | ativas | todas
var campanhaAberta = null;
var leadsFiltro = { status: "abertos", busca: "" };
var CRM_CHAVE = "crm-trafego-dados";
var META_CACHE = "crm-trafego-meta";
var NUVEM_CHAVE = "crm-trafego-nuvem";
var NUVEM_ARQUIVO = "crm.json";

var STATUS = [
  { id: "novo", nome: "Novo", ico: "🆕" },
  { id: "atendimento", nome: "Em atendimento", ico: "💬" },
  { id: "orcamento", nome: "Orçamento", ico: "🧾" },
  { id: "vendido", nome: "Vendido", ico: "✅" },
  { id: "perdido", nome: "Perdido", ico: "❌" },
];
var ORIGENS = [
  { id: "meta", nome: "Anúncio (Meta/Instagram/Facebook)" },
  { id: "organico", nome: "Instagram/Facebook orgânico" },
  { id: "whatsapp", nome: "WhatsApp direto" },
  { id: "indicacao", nome: "Indicação" },
  { id: "loja", nome: "Passou na loja" },
  { id: "google", nome: "Google / site" },
  { id: "outro", nome: "Outro" },
];
var CORES_LOJA = ["#f2762e", "#1e7fc2", "#2e8b57", "#7b4fb0", "#b7791f", "#c0392b"];
var OBJETIVOS = { OUTCOME_AWARENESS: "Reconhecimento", BRAND_AWARENESS: "Reconhecimento", REACH: "Alcance", OUTCOME_ENGAGEMENT: "Engajamento/mensagens",
  OUTCOME_TRAFFIC: "Tráfego", LINK_CLICKS: "Cliques", OUTCOME_LEADS: "Leads", OUTCOME_SALES: "Vendas", VIDEO_VIEWS: "Vídeo", MESSAGES: "Mensagens", CONVERSIONS: "Conversões" };
var OBJETIVOS_SEM_MSG = ["OUTCOME_AWARENESS", "BRAND_AWARENESS", "REACH", "VIDEO_VIEWS", "OUTCOME_TRAFFIC", "LINK_CLICKS"];

function crmPadrao(){
  var agora = new Date().toISOString();
  return {
    versao: 1,
    lojas: [
      { id: "loja-iphone", nome: "Loja de iPhone", cor: "#f2762e", palavras: ["iphone", "celular", "boleto", "importados"], padrao: true, meta_gasto_mes: 0, meta_custo_msg: 15, atualizado_em: agora },
      { id: "loja-gas", nome: "Depósito de Gás e Água", cor: "#1e7fc2", palavras: ["gás", "gas", "água", "agua", "botijão", "botijao", "galão"], padrao: false, meta_gasto_mes: 0, meta_custo_msg: 15, atualizado_em: agora },
    ],
    atribuicoes: {},   // campanha_id -> { loja_id, em }
    leads: [],
    config: { limite_custo_msg: 15, limite_freq: 3 },
    config_em: agora,
  };
}

// ============================================================ utilidades
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]; }); }
function semAcento(s){ return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function brl(v){ if (v == null || isNaN(v)) return "—"; return "R$ " + Number(v).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function brlCurto(v){ if (v == null || isNaN(v)) return "—"; if (Math.abs(v) >= 10000) return "R$ " + (v / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " mil"; return brl(v); }
function inteiro(v){ if (v == null || isNaN(v)) return "—"; return Math.round(v).toLocaleString("pt-BR"); }
function num1(v, c){ if (v == null || isNaN(v)) return "—"; return Number(v).toLocaleString("pt-BR", { minimumFractionDigits: c == null ? 1 : c, maximumFractionDigits: c == null ? 1 : c }); }
function pct(v){ if (v == null || isNaN(v) || !isFinite(v)) return "—"; return num1(v * 100, 1) + "%"; }
function dataBR(iso){ if (!iso) return "—"; var p = iso.slice(0, 10).split("-"); return p[2] + "/" + p[1] + (p[0] !== String(new Date().getFullYear()) ? "/" + p[0] : ""); }
function dataBRcompleta(iso){ if (!iso) return "—"; var p = iso.slice(0, 10).split("-"); return p[2] + "/" + p[1] + "/" + p[0]; }
function horaCurta(iso){ if (!iso) return ""; var d = new Date(iso); return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) + " " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); }
function isoDia(d){ return d.toISOString().slice(0, 10); }
function somaDias(iso, n){ var d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return isoDia(d); }
function diasEntre(a, b){ return Math.round((new Date(b + "T12:00:00Z") - new Date(a + "T12:00:00Z")) / 86400000) + 1; }
function diaSemana(iso){ return ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"][new Date(iso + "T12:00:00Z").getUTCDay()]; }
function hojeLocal(){ var d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function toast(txt){ var t = $("toast"); t.textContent = txt; t.classList.add("mostra"); clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("mostra"); }, 2600); }
function telLimpo(t){ return String(t || "").replace(/\D/g, ""); }
function waLink(t){ var n = telLimpo(t); if (!n) return ""; if (n.length <= 11) n = "55" + n; return "https://wa.me/" + n; }
function utf8b64(b){ return decodeURIComponent(Array.prototype.map.call(atob(b.replace(/\n/g, "")), function(c){ return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2); }).join("")); }
function b64utf8(s){ return btoa(encodeURIComponent(s).replace(/%([0-9A-F]{2})/g, function(_, p){ return String.fromCharCode(parseInt(p, 16)); })); }
function deltaHtml(atual, anterior, invertido){
  if (anterior == null || atual == null || !anterior || isNaN(atual) || isNaN(anterior)) return "";
  var d = (atual - anterior) / Math.abs(anterior); if (!isFinite(d)) return "";
  var bom = invertido ? d < 0 : d > 0; var cls = Math.abs(d) < 0.005 ? "" : (bom ? "up" : "down");
  return '<div class="d ' + cls + '">' + (d > 0 ? "▲ " : d < 0 ? "▼ " : "") + pct(Math.abs(d)) + ' vs. anterior</div>';
}

// ============================================================ período
function referencia(){ return (META && META.periodo && META.periodo.fim) || somaDias(hojeLocal(), -1); }
function intervalo(p){
  p = p || periodo; var fim = referencia(), ini;
  switch (p.tipo) {
    case "ontem": ini = fim; break;
    case "7d": ini = somaDias(fim, -6); break;
    case "14d": ini = somaDias(fim, -13); break;
    case "30d": ini = somaDias(fim, -29); break;
    case "90d": ini = somaDias(fim, -89); break;
    case "mes": ini = fim.slice(0, 8) + "01"; break;
    case "mes_ant": { var m = somaDias(fim.slice(0, 8) + "01", -1); ini = m.slice(0, 8) + "01"; fim = m; break; }
    case "tudo": ini = (META && META.periodo && META.periodo.inicio) || somaDias(fim, -365); break;
    case "custom": ini = p.inicio || somaDias(fim, -29); fim = p.fim || fim; if (ini > fim) { var x = ini; ini = fim; fim = x; } break;
    default: ini = somaDias(fim, -29);
  }
  // Os dados da Meta vão até ontem; leads e vendas de hoje também contam no período.
  var fimLeads = (p.tipo === "custom" || p.tipo === "mes_ant") ? fim : (fim >= referencia() ? hojeLocal() : fim);

}
function intervaloAnterior(iv){ var fim = somaDias(iv.inicio, -1); return { fim: fim, fim_leads: fim, inicio: somaDias(iv.inicio, -iv.dias), dias: iv.dias }; }
function rotuloPeriodo(iv){ return dataBR(iv.inicio) + (iv.inicio === iv.fim ? "" : " a " + dataBR(iv.fim)); }
var PERIODOS = [["ontem", "Ontem"], ["7d", "7 dias"], ["14d", "14 dias"], ["30d", "30 dias"], ["mes", "Este mês"], ["mes_ant", "Mês passado"], ["90d", "90 dias"], ["tudo", "Tudo"], ["custom", "Datas"]];

// ============================================================ lojas e campanhas
function lojas(){ return (CRM.lojas || []).filter(function(l){ return !l.apagado; }); }
function lojaPorId(id){ return lojas().find(function(l){ return l.id === id; }) || null; }

function lojaDaCampanha(cid){
  var a = CRM.atribuicoes[cid];
  if (a && a.loja_id && lojaPorId(a.loja_id)) return a.loja_id;
  if (a && a.loja_id === "" ) return "";
  var c = campPorId(cid); var nome = semAcento(c ? c.nome : "");
  var ls = lojas();
  for (var i = 0; i < ls.length; i++) {
    var ps = ls[i].palavras || [];
    for (var j = 0; j < ps.length; j++) if (ps[j] && nome.indexOf(semAcento(ps[j])) >= 0) return ls[i].id;
  }
  var padrao = ls.find(function(l){ return l.padrao; });
  return padrao ? padrao.id : "";
}
function campanhaNaLoja(cid){ return lojaFiltro === "todas" || lojaDaCampanha(cid) === lojaFiltro; }
function nomeLoja(id){ var l = lojaPorId(id); return l ? l.nome : "Sem loja"; }

// ============================================================ agregação
function linhas(diario, iv, lojaId){
  return (diario || []).filter(function(l){
    if (l.data < iv.inicio || l.data > iv.fim) return false;
    if (lojaId && lojaId !== "todas" && lojaDaCampanha(l.campanha_id) !== lojaId) return false;
    return true;
  });
}
function agregar(ls){
  var t = { gasto: 0, alcance: 0, impressoes: 0, cliques: 0, cliques_link: 0, mensagens: 0, freqS: 0, freqN: 0, dias: {}, acoes: {} };
  ls.forEach(function(l){
    t.gasto += l.gasto || 0; t.alcance += l.alcance || 0; t.impressoes += l.impressoes || 0;
    t.cliques += l.cliques || 0; t.cliques_link += l.cliques_link || 0; t.mensagens += l.mensagens || 0;
    if (l.frequencia && l.impressoes) { t.freqS += l.frequencia * l.impressoes; t.freqN += l.impressoes; }
    t.dias[l.data] = 1;
    var ac = l.acoes || {}; for (var k in ac) t.acoes[k] = (t.acoes[k] || 0) + ac[k];
  });
  t.custo_msg = t.mensagens ? t.gasto / t.mensagens : null;
  t.ctr = t.impressoes ? t.cliques_link / t.impressoes : null;
  t.cpm = t.impressoes ? t.gasto / t.impressoes * 1000 : null;
  t.cpc = t.cliques_link ? t.gasto / t.cliques_link : null;

}
function porChave(ls, chave){
  var m = {};
  ls.forEach(function(l){ var k = l[chave] || ""; (m[k] = m[k] || []).push(l); });
  return Object.keys(m).map(function(k){ var a = agregar(m[k]); a.chave = k; return a; });
}
function serieDiaria(ls, iv){
  var m = {}; ls.forEach(function(l){ var d = m[l.data] = m[l.data] || { data: l.data, gasto: 0, mensagens: 0, cliques_link: 0, alcance: 0 }; d.gasto += l.gasto || 0; d.mensagens += l.mensagens || 0; d.cliques_link += l.cliques_link || 0; d.alcance += l.alcance || 0; });
  var out = []; for (var d = iv.inicio; d <= iv.fim; d = somaDias(d, 1)) out.push(m[d] || { data: d, gasto: 0, mensagens: 0, cliques_link: 0, alcance: 0 });
  return out;
}

// leads
function leadsAtivos(){ return (CRM.leads || []).filter(function(l){ return !l.apagado; }); }
function leadsNoPeriodo(iv, lojaId){

}

  return { vendas: v.length, faturamento: fat, custo_venda: v.length ? gasto / v.length : null, roas: gasto && v.length ? fat / gasto : null };
}

// ============================================================ gráficos
function graficoDiario(serie){
  var W = 640, H = 190, pl = 44, pr = 34, pt = 10, pb = 26, n = serie.length;
  if (!n) return '<div class="vazio">Sem dados no período.</div>';
  var maxG = Math.max.apply(null, serie.map(function(s){ return s.gasto; }).concat([1]));
  var maxM = Math.max.apply(null, serie.map(function(s){ return s.mensagens; }).concat([1]));
  var iw = (W - pl - pr) / n, bw = Math.max(2, iw * 0.7);
  var svg = '<svg class="grafico" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">';
  for (var g = 0; g <= 3; g++) { var y = pt + (H - pt - pb) * g / 3; svg += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y + '" stroke="#e9e5dc"/>'; svg += '<text x="' + (pl - 4) + '" y="' + (y + 4) + '" font-size="10" text-anchor="end" fill="#8a94a0">' + esc(brlCurto(maxG * (1 - g / 3)).replace("R$ ", "")) + '</text>'; svg += '<text x="' + (W - pr + 4) + '" y="' + (y + 4) + '" font-size="10" fill="#1e7fc2">' + Math.round(maxM * (1 - g / 3)) + '</text>'; }
  var pts = [];
  serie.forEach(function(s, i){
    var x = pl + i * iw + (iw - bw) / 2, h = (H - pt - pb) * s.gasto / maxG;
    svg += '<rect x="' + x + '" y="' + (H - pb - h) + '" width="' + bw + '" height="' + h + '" rx="2" fill="#f2762e" opacity="0.85"><title>' + esc(dataBR(s.data) + ": " + brl(s.gasto) + " · " + s.mensagens + " msgs") + '</title></rect>';
    pts.push((pl + i * iw + iw / 2) + "," + (H - pb - (H - pt - pb) * s.mensagens / maxM));
    var passo = n > 40 ? 7 : n > 14 ? 3 : 1;
    if (i % passo === 0) svg += '<text x="' + (pl + i * iw + iw / 2) + '" y="' + (H - 8) + '" font-size="10" text-anchor="middle" fill="#8a94a0">' + esc(n <= 14 ? diaSemana(s.data) + " " + s.data.slice(8) : dataBR(s.data)) + '</text>';
  });
  svg += '<polyline points="' + pts.join(" ") + '" fill="none" stroke="#1e7fc2" stroke-width="2.2" stroke-linejoin="round"/>';
  serie.forEach(function(s, i){ if (s.mensagens) svg += '<circle cx="' + (pl + i * iw + iw / 2) + '" cy="' + (H - pb - (H - pt - pb) * s.mensagens / maxM) + '" r="2.5" fill="#1e7fc2"><title>' + esc(dataBR(s.data) + ": " + s.mensagens + " msgs") + '</title></circle>'; });
  svg += '</svg><div class="legenda"><span><i style="background:#f2762e"></i>Investimento (R$)</span><span><i style="background:#1e7fc2"></i>Mensagens / leads</span></div>';
  return svg;
}
function barras(itens, opc){
  opc = opc || {};
  if (!itens.length) return '<div class="vazio">' + esc(opc.vazio || "Sem dados.") + '</div>';
  var max = Math.max.apply(null, itens.map(function(i){ return i.valor || 0; }).concat([0.0001]));
  return '<div class="barras">' + itens.map(function(i){
    var extra = i.extra ? ' <small>' + esc(i.extra) + '</small>' : "";
    return '<div class="barra" title="' + esc(i.titulo || "") + '"><div class="n">' + (i.html || esc(i.nome)) + '</div><div class="t"><i style="width:' + (100 * (i.valor || 0) / max) + '%; background:' + esc(i.cor || opc.cor || "#f2762e") + '"></i></div><div class="v">' + esc(i.rotulo != null ? i.rotulo : inteiro(i.valor)) + extra + '</div></div>';
  }).join("") + '</div>';
}
function kpi(rotulo, valor, extra, destaque){ return '<div class="kpi' + (destaque ? " destaque" : "") + '"><div class="r">' + esc(rotulo) + '</div><div class="v">' + esc(valor) + '</div>' + (extra || "") + '</div>'; }

function alertasPeriodo(iv){
  var avisos = [];
  if (!META) return avisos;
  var lim = Number(CRM.config.limite_custo_msg) || 15, limF = Number(CRM.config.limite_freq) || 3;
  if (META.alertas && META.alertas.itens && META.alertas.data) {
    META.alertas.itens.forEach(function(a){ if (campanhaNaLoja(a.campanha_id)) avisos.push({ nivel: "alerta", texto: "Ontem (" + dataBR(META.alertas.data) + "): " + a.texto }); });
  }
  var ls = linhas(META.diario_campanha, iv, lojaFiltro);
  porChave(ls, "campanha_id").forEach(function(c){
    var camp = campPorId(c.chave); if (!camp || c.gasto < 5) return;

    if (!c.mensagens) avisos.push({ nivel: "alerta", texto: "'" + camp.nome + "' gastou " + brl(c.gasto) + " no período e não gerou mensagem." });
    else if (c.custo_msg > lim * 1.5 && c.mensagens >= 3) avisos.push({ nivel: "alerta", texto: "'" + camp.nome + "': custo por mensagem " + brl(c.custo_msg) + ", bem acima do limite de " + brl(lim) + "." });
    if (c.frequencia >= limF) avisos.push({ nivel: "info", texto: "'" + camp.nome + "' com frequência " + num1(c.frequencia) + ": o mesmo público já viu muitas vezes." });
  });
  lojas().forEach(function(l){
    if (lojaFiltro !== "todas" && lojaFiltro !== l.id) return;
    if (l.meta_gasto_mes > 0) {
      var mes = intervalo({ tipo: "mes" }); var g = agregar(linhas(META.diario_campanha, mes, l.id)).gasto;
      var diasMes = new Date(Number(mes.fim.slice(0, 4)), Number(mes.fim.slice(5, 7)), 0).getDate();
      var ritmo = g / diasEntre(mes.inicio, mes.fim) * diasMes;
      if (g > l.meta_gasto_mes) avisos.push({ nivel: "erro", texto: l.nome + " já passou da meta do mês: " + brl(g) + " de " + brl(l.meta_gasto_mes) + "." });
      else if (ritmo > l.meta_gasto_mes * 1.1) avisos.push({ nivel: "alerta", texto: l.nome + ": no ritmo atual o mês fecha em " + brl(ritmo) + ", acima da meta de " + brl(l.meta_gasto_mes) + "." });
    }
  });

  if (abertos.length) avisos.push({ nivel: "info", texto: abertos.length + " lead(s) sem movimentação há mais de 2 dias. Vale um retorno pelo WhatsApp." });
  return avisos;
}

var nuvem = { token: "", repo: "", branch: "main", sha: null, ultimaSync: null, pendente: false, ocupado: false, erro: "" };
var nuvemTimer = null, nuvemPoll = null;
function limparChave(t){ return String(t || "").replace(/[\s​-‍﻿]/g, ""); }
function nuvemLerConfig(){ try { var c = JSON.parse(localStorage.getItem(NUVEM_CHAVE) || "null"); if (c && c.token && c.repo) { nuvem.token = c.token; nuvem.repo = c.repo; nuvem.branch = c.branch || "main"; nuvem.sha = c.sha || null; nuvem.ultimaSync = c.ultimaSync || null; nuvem.pendente = !!c.pendente; } } catch (e) {} }
function nuvemGravarConfig(){ try { localStorage.setItem(NUVEM_CHAVE, JSON.stringify({ token: nuvem.token, repo: nuvem.repo, branch: nuvem.branch, sha: nuvem.sha, ultimaSync: nuvem.ultimaSync, pendente: nuvem.pendente })); } catch (e) {} }
function nuvemLigada(){ return !!(nuvem.token && nuvem.repo); }
function nuvemUrl(){ return "https://api.github.com/repos/" + nuvem.repo + "/contents/" + NUVEM_ARQUIVO; }
function nuvemHeaders(){ return { "Authorization": "Bearer " + nuvem.token, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" }; }
async function nuvemRepoInfo(){
  var rr = await fetch("https://api.github.com/repos/" + nuvem.repo + "?_=" + Date.now(), { headers: nuvemHeaders(), cache: "no-store" });
  if (rr.status === 404) throw new Error("a chave não tem acesso ao repositório " + nuvem.repo + " — confira o nome e, na página da chave, marque esse repositório");
  if (rr.status === 401) throw new Error("chave inválida ou vencida");
  if (!rr.ok) throw new Error("GitHub respondeu " + rr.status);
  return rr.json();
}
async function nuvemBaixar(){
  if (!/^(github_pat_|ghp_)[A-Za-z0-9_]{20,}$/.test(nuvem.token)) throw new Error("a chave parece incompleta — copie de novo");
  var r = await fetch(nuvemUrl() + "?ref=" + encodeURIComponent(nuvem.branch) + "&_=" + Date.now(), { headers: nuvemHeaders(), cache: "no-store" });
  if (r.status === 404) {
    var info = await nuvemRepoInfo();
    if (info.default_branch && info.default_branch !== nuvem.branch) { nuvem.branch = info.default_branch; nuvemGravarConfig(); return nuvemBaixar(); }
    return { obj: null, sha: null }; // arquivo ainda não existe
  }
  if (r.status === 401) throw new Error("chave inválida ou vencida");
  if (!r.ok) throw new Error("GitHub respondeu " + r.status);
  var j = await r.json(); var obj;
  try { obj = JSON.parse(utf8b64(j.content)); } catch (e) { throw new Error("arquivo na nuvem está corrompido"); }
  return { obj: obj, sha: j.sha };
}
async function nuvemSubir(obj, sha){
  var corpo = { message: "CRM de tráfego — " + new Date().toLocaleString("pt-BR"), content: b64utf8(JSON.stringify(obj)), branch: nuvem.branch };
  if (sha) corpo.sha = sha;
  var r = await fetch(nuvemUrl(), { method: "PUT", headers: Object.assign({ "Content-Type": "application/json" }, nuvemHeaders()), body: JSON.stringify(corpo) });
  if (r.status === 404) throw new Error("sem permissão de escrita no repositório " + nuvem.repo + " — na chave, em Contents, escolha Read and write");
  if (r.status === 409 || r.status === 422) return null; // alguém gravou antes: baixa e mescla de novo
  if (!r.ok) throw new Error("GitHub respondeu " + r.status + " ao gravar");
  var j = await r.json(); return j.content.sha;
}
function mesclarLista(a, b){
  var m = {};
  (a || []).concat(b || []).forEach(function(x){ if (!x || !x.id) return; var atual = m[x.id]; if (!atual || (x.atualizado_em || "") > (atual.atualizado_em || "")) m[x.id] = x; });
  return Object.keys(m).map(function(k){ return m[k]; });
}
function mesclar(local, remoto){
  if (!remoto) return local;
  var out = { versao: 1, lojas: mesclarLista(local.lojas, remoto.lojas), leads: mesclarLista(local.leads, remoto.leads), atribuicoes: {}, config: local.config, config_em: local.config_em || "" };
  var at = Object.assign({}, remoto.atribuicoes || {}); for (var k in (local.atribuicoes || {})) { var l = local.atribuicoes[k], r = at[k]; if (!r || (l.em || "") > (r.em || "")) at[k] = l; } out.atribuicoes = at;
  if ((remoto.config_em || "") > (local.config_em || "")) { out.config = remoto.config; out.config_em = remoto.config_em; }
  var limite = new Date(Date.now() - 120 * 86400000).toISOString();
  out.leads = out.leads.filter(function(l){ return !(l.apagado && (l.atualizado_em || "") < limite); });
  out.atualizado_em = new Date().toISOString();
  return out;
}
async function nuvemSincronizar(motivo){
  if (!nuvemLigada() || nuvem.ocupado) return;
  if (!navigator.onLine) { nuvem.pendente = true; nuvemGravarConfig(); nuvemStatus("☁️ sem internet — sincroniza depois"); return; }
  nuvem.ocupado = true; nuvemStatus("☁️ sincronizando…");
  try {
    for (var tentativa = 0; tentativa < 3; tentativa++) {
      var baixado = await nuvemBaixar();
      var junto = mesclar(CRM, baixado.obj);
      var localJson = JSON.stringify(CRM), remotoJson = JSON.stringify(baixado.obj);
      var juntoSemData = Object.assign({}, junto); delete juntoSemData.atualizado_em;
      var remotoSemData = Object.assign({}, baixado.obj || {}); delete remotoSemData.atualizado_em;
      var precisaSubir = !baixado.obj || JSON.stringify(juntoSemData) !== JSON.stringify(remotoSemData);
      CRM = junto; gravarCRM("nuvem");
      if (!precisaSubir) { nuvem.sha = baixado.sha; break; }
      var sha = await nuvemSubir(junto, baixado.sha);
      if (sha) { nuvem.sha = sha; break; }
    }
    nuvem.pendente = false; nuvem.erro = ""; nuvem.ultimaSync = new Date().toISOString(); nuvemGravarConfig();
    nuvemStatus("☁️ sincronizado " + horaCurta(nuvem.ultimaSync)); render();
  } catch (e) {
    nuvem.erro = e.message; nuvem.pendente = true; nuvemGravarConfig(); nuvemStatus("⚠️ nuvem: " + e.message); if (tela === "ajustes") render();
  } finally { nuvem.ocupado = false; }
}

function nuvemAgendarEnvio(){ if (!nuvemLigada()) return; nuvem.pendente = true; nuvemGravarConfig(); clearTimeout(nuvemTimer); nuvemTimer = setTimeout(function(){ nuvemSincronizar("edicao"); }, 2500); }
async function nuvemConectar(){
  var repo = $("nvRepo").value.trim().replace(/^https?:\/\/github\.com\//, "").replace(/\.git$/, "").replace(/\/+$/, ""); var token = limparChave($("nvToken").value);
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { toast("Informe o repositório como usuário/nome."); return; }

}
function nuvemSair(){ if (!confirm("Desconectar este aparelho da nuvem? Os leads continuam aqui.")) return; nuvem = { token: "", repo: "", branch: "main", sha: null, ultimaSync: null, pendente: false, ocupado: false, erro: "" }; try { localStorage.removeItem(NUVEM_CHAVE); } catch (e) {} clearInterval(nuvemPoll); nuvemStatus(""); render(); }
function nuvemIniciarPoll(){ clearInterval(nuvemPoll); if (!nuvemLigada()) return; nuvemPoll = setInterval(function(){ if (document.visibilityState === "visible") nuvemSincronizar("poll"); }, 3 * 60 * 1000); }

// ============================================================ modal, eventos
function abrirModal(html){ $("modal").innerHTML = html; $("modalFundo").classList.add("aberto"); }
function fecharModal(){ $("modalFundo").classList.remove("aberto"); $("modal").innerHTML = ""; }
function irPara(t){ tela = t; document.querySelectorAll("nav button").forEach(function(b){ b.classList.toggle("ativa", b.dataset.tela === t); }); document.querySelectorAll(".tela").forEach(function(s){ s.classList.toggle("ativa", s.id === "tela-" + t); }); window.scrollTo(0, 0); render(); }

document.addEventListener("click", function(ev){
  var b = ev.target.closest("[data-tela]"); if (b) { irPara(b.dataset.tela); return; }
  var p = ev.target.closest("[data-p]"); if (p) { periodo.tipo = p.dataset.p; if (periodo.tipo === "custom") { periodo.inicio = periodo.inicio || somaDias(referencia(), -29); periodo.fim = periodo.fim || referencia(); $("dtInicio").value = periodo.inicio; $("dtFim").value = periodo.fim; } render(); return; }
  var l = ev.target.closest("[data-l]"); if (l) { lojaFiltro = l.dataset.l; render(); return; }
  var ir = ev.target.closest("[data-ir]"); if (ir) { ev.preventDefault(); irPara(ir.dataset.ir); return; }
  if (ev.target.closest("[data-novo-lead]")) { abrirLead(null); return; }
  var ed = ev.target.closest("[data-editar-lead]"); if (ed) { abrirLead(ed.dataset.editarLead); return; }
  var sl = ev.target.closest("[data-salvar-lead]"); if (sl) { salvarLead(sl.dataset.salvarLead); return; }
  var ap = ev.target.closest("[data-apagar-lead]"); if (ap) { apagarLead(ap.dataset.apagarLead); return; }
  var st = ev.target.closest("[data-lead-status]"); if (st) { var ld = CRM.leads.find(function(x){ return x.id === st.dataset.leadStatus; }); if (ld) { var agora = new Date().toISOString(); mudarStatus(ld, st.dataset.status, agora, ld.status); ld.atualizado_em = agora; gravarCRM("lead"); render(); } return; }
  var lf = ev.target.closest("[data-lf]"); if (lf) { leadsFiltro.status = lf.dataset.lf; render(); return; }
  if (ev.target.closest("[data-exportar-csv]")) { exportarCSV(); return; }
  if (ev.target.closest("[data-exportar-json]")) { var blob = new Blob([JSON.stringify(CRM, null, 1)], { type: "application/json" }); var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "crm-backup-" + hojeLocal() + ".json"; a.click(); return; }
  var cs = ev.target.closest("[data-camp-so]"); if (cs) { campanhasSo = cs.dataset.campSo; render(); return; }
  var camp = ev.target.closest("[data-camp]"); if (camp && !ev.target.closest("select")) { campanhaAberta = campanhaAberta === camp.dataset.camp ? null : camp.dataset.camp; render(); return; }
  var svl = ev.target.closest("[data-salvar-loja]"); if (svl) { salvarLoja(svl.dataset.salvarLoja); return; }
  var apl = ev.target.closest("[data-apagar-loja]"); if (apl) { var lj = CRM.lojas.find(function(x){ return x.id === apl.dataset.apagarLoja; }); if (lj && confirm("Remover a loja " + lj.nome + "? As campanhas dela ficam sem loja.")) { lj.apagado = true; lj.atualizado_em = new Date().toISOString(); gravarCRM("loja"); render(); } return; }
  if (ev.target.closest("[data-nova-loja]")) { var n = lojas().length; CRM.lojas.push({ id: "loja-" + uid(), nome: "Nova loja", cor: CORES_LOJA[n % CORES_LOJA.length], palavras: [], padrao: false, meta_gasto_mes: 0, meta_custo_msg: 15, atualizado_em: new Date().toISOString() }); gravarCRM("loja"); render(); return; }
  if (ev.target.closest("[data-salvar-cfg]")) { CRM.config = { limite_custo_msg: Number($("cfgCusto").value) || 15, limite_freq: Number($("cfgFreq").value) || 3 }; CRM.config_em = new Date().toISOString(); gravarCRM("config"); toast("Regras salvas."); return; }
  if (ev.target.closest("[data-nuvem-conectar]")) { nuvemConectar(); return; }
  if (ev.target.closest("[data-nuvem-agora]")) { nuvemSincronizar("manual"); return; }
  if (ev.target.closest("[data-nuvem-sair]")) { nuvemSair(); return; }
  if (ev.target.closest("[data-recarregar-meta]")) { carregarMeta(true); return; }
  if (ev.target.closest("[data-fechar]") || ev.target === $("modalFundo")) { fecharModal(); return; }
});
document.addEventListener("change", function(ev){
  var s = ev.target.closest("[data-loja-camp]"); if (s) { CRM.atribuicoes[s.dataset.lojaCamp] = { loja_id: s.value, em: new Date().toISOString() }; gravarCRM("atribuicao"); render(); return; }
  if (ev.target.id === "dtInicio" || ev.target.id === "dtFim") { periodo.inicio = $("dtInicio").value || periodo.inicio; periodo.fim = $("dtFim").value || periodo.fim; render(); return; }
  if (ev.target.id === "importarJson") { var f = ev.target.files[0]; if (!f) return; var rd = new FileReader(); rd.onload = function(){ try { var obj = JSON.parse(rd.result); if (!obj.lojas || !obj.leads) throw new Error("arquivo não é um backup do CRM"); CRM = mesclar(CRM, obj); gravarCRM("importar"); render(); toast("Backup restaurado e mesclado."); } catch (e) { toast("Não deu: " + e.message); } }; rd.readAsText(f); return; }
});
document.addEventListener("input", function(ev){ if (ev.target.id === "leadsBusca") { leadsFiltro.busca = ev.target.value; var pos = ev.target.selectionStart; render(); var el = $("leadsBusca"); el.focus(); el.setSelectionRange(pos, pos); } });
document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") { carregarMeta(false); nuvemSincronizar("voltar"); } });
window.addEventListener("online", function(){ nuvemSincronizar("online"); });

// ============================================================ início
carregarCRM(); nuvemLerConfig(); render(); carregarMeta(false);
if (nuvemLigada()) { nuvemSincronizar("abrir"); nuvemIniciarPoll(); }
if ("serviceWorker" in navigator) { /* sem service worker: o painel é leve e carrega direto do GitHub Pages */ }
</script>
</body>
